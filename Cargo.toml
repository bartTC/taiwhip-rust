[package]
name = "tailwhip"
version = "0.14.0"
edition = "2024"
description = "Sort Tailwind CSS classes in HTML and CSS files."
license = "MIT"
authors = ["Martin Mahner <martin@mahner.org>"]
repository = "https://github.com/bartTC/tailwhip"

[lib]
name = "tailwhip"
path = "src/lib.rs"

[[bin]]
name = "tailwhip"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
rayon = "1.12"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
similar = "3"
smallvec = "1"
toml = "1.1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
