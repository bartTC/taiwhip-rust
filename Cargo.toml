[package]
name = "tailwhip"
version = "0.14.0"
edition = "2024"
description = "Sort Tailwind CSS classes in HTML and CSS files."
license = "MIT"
authors = ["Martin Mahner <martin@mahner.org>"]
repository = "https://github.com/bartTC/taiwhip-rust"

[lib]
name = "tailwhip"
path = "src/lib.rs"

[[bin]]
name = "tailwhip"
path = "src/main.rs"

[dependencies]
globset = "0.4"
ignore = "0.4"
lexopt = "0.3"
memchr = "2"
rayon = "1.12"
regex-automata = "0.4"
regex-syntax = "0.8"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
similar = "3"
smallvec = "1"
toml = "1.1"

[build-dependencies]
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
